name: MeloNext iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - XC-ios-ht

jobs:
  build:
    name: Build MeloNext
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain and available simulators
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo '--- Available iOS Simulator runtimes ---'
          xcrun simctl list runtimes | grep -E 'iOS|iPadOS' || true
          echo '--- Available iOS Simulator devices ---'
          xcrun simctl list devices available || true

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 6 -name '*.xcodeproj' -print -quit)
          workspace=$(find . -maxdepth 6 -name '*.xcworkspace' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $workspace"
          elif [[ -n "$project" ]]; then
            echo "project=$project" >> "$GITHUB_OUTPUT"
            echo "Using project: $project"
          else
            echo 'No Xcode project or workspace found.' >&2
            exit 1
          fi

      - name: Select a concrete iOS Simulator destination
        id: destination
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            destinations=$(xcodebuild -workspace '${{ steps.project.outputs.workspace }}' -scheme MeloNX -showdestinations 2>&1)
          else
            destinations=$(xcodebuild -project '${{ steps.project.outputs.project }}' -scheme MeloNX -showdestinations 2>&1)
          fi

          echo "$destinations"

          # Prefer a concrete iPhone destination. The generic
          # "platform=iOS Simulator" specifier is not accepted by this
          # Xcode version when the scheme exposes only concrete devices.
          destination_id=$(printf '%s\n' "$destinations" \
            | grep 'platform:iOS Simulator' \
            | grep 'arch:arm64' \
            | grep -v 'placeholder' \
            | sed -n 's/.*id:\([^,]*\),.*name:\(iPhone[^}]*\).*/\1/p' \
            | head -n 1)

          if [[ -z "$destination_id" ]]; then
            # Fall back to any concrete iOS Simulator if an iPhone is not exposed.
            destination_id=$(printf '%s\n' "$destinations" \
              | grep 'platform:iOS Simulator' \
              | grep 'arch:arm64' \
              | grep -v 'placeholder' \
              | sed -n 's/.*id:\([^,]*\),.*/\1/p' \
              | head -n 1)
          fi

          if [[ -z "$destination_id" ]]; then
            echo 'Could not find a concrete iOS Simulator destination.' >&2
            exit 1
          fi

          echo "id=$destination_id" >> "$GITHUB_OUTPUT"
          echo "Selected simulator destination: $destination_id"

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          destination="id=${{ steps.destination.outputs.id }}"

          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            xcodebuild \
              -workspace '${{ steps.project.outputs.workspace }}' \
              -scheme MeloNX \
              -destination "$destination" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project '${{ steps.project.outputs.project }}' \
              -scheme MeloNX \
              -destination "$destination" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melnext-build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
