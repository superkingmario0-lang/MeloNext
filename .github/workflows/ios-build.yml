name: MeloNext iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - XC-ios-ht

jobs:
  build:
    name: Build MeloNext
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain and available simulators
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo '--- Available iOS Simulator runtimes ---'
          xcrun simctl list runtimes | grep -E 'iOS|iPadOS' || true
          echo '--- Available iOS Simulator devices ---'
          xcrun simctl list devices available || true

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 6 -name '*.xcodeproj' -print -quit)
          workspace=$(find . -maxdepth 6 -name '*.xcworkspace' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $workspace"
          elif [[ -n "$project" ]]; then
            echo "project=$project" >> "$GITHUB_OUTPUT"
            echo "Using project: $project"
          else
            echo 'No Xcode project or workspace found.' >&2
            exit 1
          fi

      - name: Show MeloNX schemes and destinations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            xcodebuild -workspace '${{ steps.project.outputs.workspace }}' -scheme MeloNX -showdestinations || true
          else
            xcodebuild -project '${{ steps.project.outputs.project }}' -scheme MeloNX -showdestinations || true
          fi

      - name: Build for an available iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          # Ask Xcode to choose a compatible simulator instead of assuming a
          # particular iPhone model/runtime exists on the hosted runner.
          destination='platform=iOS Simulator'

          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            xcodebuild \
              -workspace '${{ steps.project.outputs.workspace }}' \
              -scheme MeloNX \
              -destination "$destination" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project '${{ steps.project.outputs.project }}' \
              -scheme MeloNX \
              -destination "$destination" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melnext-build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
