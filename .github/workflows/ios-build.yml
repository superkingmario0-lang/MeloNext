name: MeloNext iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - XC-ios-ht

jobs:
  build:
    name: Build MeloNext
    # The bundled native frameworks/libraries are device-arm64 builds.
    # Building an x86_64 simulator target cannot link them, so build the
    # actual iOS arm64 target instead.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify native dependency files
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Git LFS status ---'
          git lfs status || true
          echo '--- Native dependency file types ---'
          file "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/"*.dylib
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' \
            "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries" \
            "src/MeloNX/MeloNX/Dependencies/XCFrameworks"; then
            echo 'ERROR: Git LFS pointer files are still present.' >&2
            exit 1
          fi

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET iOS workload
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet workload install ios --skip-manifest-update

      - name: Build Ryujinx native iOS bridge
        shell: bash
        run: |
          set -euo pipefail
          project="src/Ryujinx.Headless.SDL2/Ryujinx.Headless.SDL2.csproj"
          output="src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

          echo '--- Publishing Ryujinx.Headless.SDL2 for ios-arm64 ---'
          dotnet publish "$project" \
            --configuration Release \
            --runtime ios-arm64 \
            --self-contained true \
            -p:NativeLib=Shared \
            -p:PublishAot=true

          echo '--- Locating native bridge ---'
          native=$(find "src/Ryujinx.Headless.SDL2/bin" -type f \
            \( -name 'Ryujinx.Headless.SDL2.dylib' -o -name 'Ryujinx.Headless.SDL2' \) \
            -print -quit)
          if [[ -z "$native" ]]; then
            echo 'ERROR: Native Ryujinx.Headless.SDL2 binary was not produced.' >&2
            find "src/Ryujinx.Headless.SDL2/bin" -maxdepth 8 -type f -print | head -n 200 || true
            exit 1
          fi

          mkdir -p "$(dirname "$output")"
          cp "$native" "$output"

          echo '--- Native bridge verification ---'
          file "$native"
          xcrun lipo -info "$native"
          file "$output"
          xcrun lipo -info "$output"
          test -s "$output"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo '--- Runner architecture ---'
          uname -m
          echo '--- iOS SDK ---'
          xcrun --sdk iphoneos --show-sdk-version

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 6 -name '*.xcodeproj' -print -quit)
          workspace=$(find . -maxdepth 6 -name '*.xcworkspace' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $workspace"
          elif [[ -n "$project" ]]; then
            echo "project=$project" >> "$GITHUB_OUTPUT"
            echo "Using project: $project"
          else
            echo 'No Xcode project or workspace found.' >&2
            exit 1
          fi

      - name: Show MeloNX schemes and device destinations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            xcodebuild -workspace '${{ steps.project.outputs.workspace }}' -scheme MeloNX -showdestinations || true
          else
            xcodebuild -project '${{ steps.project.outputs.project }}' -scheme MeloNX -showdestinations || true
          fi

      - name: Build for iOS device (arm64)
        id: build
        shell: bash
        run: |
          set -o pipefail
          set +e

          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            xcodebuild \
              -workspace '${{ steps.project.outputs.workspace }}' \
              -scheme MeloNX \
              -destination 'generic/platform=iOS' \
              -configuration Debug \
              SDKROOT=iphoneos \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build 2>&1 | tee xcodebuild.log
          else
            xcodebuild \
              -project '${{ steps.project.outputs.project }}' \
              -scheme MeloNX \
              -destination 'generic/platform=iOS' \
              -configuration Debug \
              SDKROOT=iphoneos \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build 2>&1 | tee xcodebuild.log
          fi

          build_status=${PIPESTATUS[0]}
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"

          echo ''
          echo '================ ACTUAL XCODE ERRORS ================'
          grep -nE '(^|[[:space:]])error:|fatal error:|Command .* failed' xcodebuild.log | tail -n 100 || true
          echo '======================================================='

          exit "$build_status"

      - name: Locate built app
        if: steps.build.outputs.build_status == '0'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*/Build/Products/Debug-iphoneos/MeloNX.app' -print -quit)
          if [[ -z "$app" ]]; then
            echo 'MeloNX.app was not produced.' >&2
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Built app: $app"

      - name: Upload unsigned iOS app
        if: steps.build.outputs.build_status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: MeloNext-unsigned-iOS-app
          path: ${{ steps.app.outputs.app }}
          if-no-files-found: error

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melnext-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melnext-build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
