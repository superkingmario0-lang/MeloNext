name: MeloNext iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - XC-ios-ht

jobs:
  build:
    name: Build MeloNext iOS
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repository and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Show Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo "--- Runner architecture ---"
          uname -m
          echo "--- iOS SDK ---"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify native dependency files
        shell: bash
        run: |
          set -euo pipefail
          echo "--- Git LFS status ---"
          git lfs status || true
          file "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/"*.dylib || true
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' \
             "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries" \
             "src/MeloNX/MeloNX/Dependencies/XCFrameworks"; then
            echo "ERROR: Git LFS pointer files are still present." >&2
            exit 1
          fi

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET iOS workload
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet workload install ios

      - name: Build Ryujinx native iOS bridge
        shell: bash
        run: |
          set -euo pipefail
          project="src/Ryujinx.Headless.SDL2/Ryujinx.Headless.SDL2.csproj"
          output="src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"

          # Publish Ryujinx bridge targeting iOS NativeAOT
          dotnet publish "$project" \
            --configuration Release \
            --runtime ios-arm64 \
            -p:PublishAot=true \
            -p:NativeLib=Shared \
            -p:SelfContained=true

          native=$(find "src/Ryujinx.Headless.SDL2/bin" -type f \
             \( -name 'Ryujinx.Headless.SDL2.dylib' -o -name 'Ryujinx.Headless.SDL2' \) \
             -print -quit)

          if [[ -z "$native" ]]; then
            echo "ERROR: Native Ryujinx.Headless.SDL2 binary was not produced." >&2
            find "src/Ryujinx.Headless.SDL2/bin" -maxdepth 8 -type f -print | head -n 200 || true
            exit 1
          fi

          mkdir -p "$(dirname "$output")"
          cp "$native" "$output"

          file "$output"
          xcrun lipo -info "$output" || true
          test -s "$output"

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 6 -name '*.xcodeproj' -print -quit)
          workspace=$(find . -maxdepth 6 -name '*.xcworkspace' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $workspace"
          elif [[ -n "$project" ]]; then
            echo "project=$project" >> "$GITHUB_OUTPUT"
            echo "Using project: $project"
          else
            echo "No Xcode project or workspace found." >&2
            exit 1
          fi

      - name: Build Release for iOS device (arm64)
        id: build
        shell: bash
        run: |
          set -o pipefail
          set +e

          COMMON_ARGS=(
            -scheme MeloNX
            -destination 'generic/platform=iOS'
            -configuration Release
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )

          if [[ -n '${{ steps.project.outputs.workspace }}' ]]; then
            xcodebuild -workspace '${{ steps.project.outputs.workspace }}' \
              "${COMMON_ARGS[@]}" build 2>&1 | tee xcodebuild.log
          else
            xcodebuild -project '${{ steps.project.outputs.project }}' \
              "${COMMON_ARGS[@]}" build 2>&1 | tee xcodebuild.log
          fi

          build_status=${PIPESTATUS[0]}
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"

          echo "================ ACTUAL XCODE ERRORS ================"
          grep -nE '(^|[[:space:]])error:|fatal error:|Command .* failed|Undefined symbols' \
             xcodebuild.log | tail -n 150 || true
          echo "======================================================"

          exit "$build_status"

      - name: Locate built app
        if: steps.build.outputs.build_status == '0'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find ~/Library/Developer/Xcode/DerivedData \
             -type d -path '*/Build/Products/Release-iphoneos/MeloNX.app' \
             -print -quit)
          if [[ -z "$app" ]]; then
            echo "MeloNX.app was not produced." >&2
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Built app: $app"

      - name: Upload unsigned iOS app
        if: steps.build.outputs.build_status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-iOS-unsigned-app
          path: ${{ steps.app.outputs.app }}
          if-no-files-found: error
